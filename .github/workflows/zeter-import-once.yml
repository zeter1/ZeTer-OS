name: Import ZeTer OS 4.0.8 (one time)
on:
  push:
    branches: [main]
    paths:
      - ".zeter-import/ZeTer-OS-4.0.8-publish-kit.zip"

permissions:
  contents: write

concurrency:
  group: zeter-os-import-4-0-8
  cancel-in-progress: false

jobs:
  import-and-verify:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Apply uploaded source and verify on Windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path(".zeter-import/ZeTer-OS-4.0.8-publish-kit.zip")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != "895570d5d8c49f6a1378c1e57f329d9aaefcaca809b522b4c842501a1049c618":
              raise SystemExit("Upload archive checksum mismatch")
          destination = Path(".zeter-import/_payload")
          destination.mkdir(exist_ok=True)
          with ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit("ZIP CRC check failed")
              expected = {"publish.py", "PUBLISHING.md", "source-delta.patch", "README-4.0.8.md", "CHANGELOG-4.0.8.md", "publish.cmd"}
              if set(z.namelist()) != expected:
                  raise SystemExit("Unexpected ZIP members")
              z.extractall(destination)
          patch = destination / "source-delta.patch"
          if hashlib.sha256(patch.read_bytes()).hexdigest() != "11f8e68f64ed990f44df68a45b2a98af8f550f00f3ee71fad7ad479daae6724b":
              raise SystemExit("Source patch checksum mismatch")
          print("Verified ZIP, patch and member list")
          PY
          git apply --3way --index .zeter-import/_payload/source-delta.patch
          python - <<'PY'
          from pathlib import Path
          src = Path(".zeter-import/_payload")
          new_readme = (src / "README-4.0.8.md").read_text(encoding="utf-8")
          remote_readme = Path("README.md").read_text(encoding="utf-8")
          heading = "## Контакты для связи с разработчиком"
          if heading not in new_readme or heading not in remote_readme:
              raise SystemExit("README contacts missing")
          if new_readme.split(heading, 1)[1].strip() != remote_readme.split(heading, 1)[1].strip():
              raise SystemExit("README contacts changed unexpectedly")
          Path("README.md").write_text(new_readme, encoding="utf-8", newline="\n")
          local_changelog = (src / "CHANGELOG-4.0.8.md").read_text(encoding="utf-8")
          remote_changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = "# История изменений\n\n"
          previous_version = "## [4.0.1]"
          if not local_changelog.startswith(heading) or previous_version not in local_changelog:
              raise SystemExit("Local changelog structure mismatch")
          if not remote_changelog.startswith(heading) or previous_version not in remote_changelog:
              raise SystemExit("Remote changelog structure mismatch")
          if "## [4.0.8]" in remote_changelog:
              raise SystemExit("Version already published")
          additions = local_changelog[len(heading):local_changelog.index(previous_version)]
          Path("CHANGELOG.md").write_text(heading + additions + remote_changelog[len(heading):], encoding="utf-8", newline="\n")
          PY
          rm -rf .zeter-import/_payload
          git rm -f -- .zeter-import/ZeTer-OS-4.0.8-publish-kit.zip .github/workflows/zeter-import-once.yml
          git add -A
          git diff --cached --check
          python -m compileall -q run_zeter_os.py problem_logs.py tools build_support
          python tools/check_project.py --strict-node
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish ZeTer OS 4.0.8 prompt library and calculations"
          git push origin HEAD:main
