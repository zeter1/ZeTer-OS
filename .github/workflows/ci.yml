name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Compile Python sources
        run: python -m compileall -q run_zeter_os.py problem_logs.py tools build_support

      - name: Run full project verification
        run: python tools/check_project.py --strict-node

      - name: Build and smoke-test native EXE
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: cmd
        run: build_exe.bat --ci

      - name: Verify packaged native distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $exe = 'dist\ZeTer-OS\ZeTer-OS.exe'
          if (-not (Test-Path $exe)) { throw 'ZeTer OS EXE was not created' }
          if (-not (Test-Path 'dist\ZeTer-OS\app\index.html')) { throw 'Packaged app/index.html is missing' }
          if (-not (Test-Path 'dist\ZeTer-OS\app\js\core\version.js')) { throw 'Packaged version.js is missing' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
