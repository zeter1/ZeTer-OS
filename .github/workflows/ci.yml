name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish a main release + feed together; a newer push must not cancel publication halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Compile Python sources
        run: python -m compileall -q run_zeter_os.py problem_logs.py app_updater.py update_runner.py tools build_support

      - name: Run full project verification
        run: python tools/check_project.py --strict-node

      - name: Build and smoke-test native EXE
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: cmd
        run: build_exe.bat --ci

      - name: Verify packaged native distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $exe = 'dist\ZeTer-OS\ZeTer-OS.exe'
          if (-not (Test-Path $exe)) { throw 'ZeTer OS EXE was not created' }
          if (-not (Test-Path 'dist\ZeTer-OS\app\index.html')) { throw 'Packaged app/index.html is missing' }
          if (-not (Test-Path 'dist\ZeTer-OS\app\js\core\version.js')) { throw 'Packaged version.js is missing' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Create portable ZIP and checksum
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: python tools/build_update_package.py --distribution dist/ZeTer-OS --output dist

      - name: Upload packaged Windows distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ZeTer-OS-Windows-x64
          path: |
            dist/ZeTer-OS-*-Windows-x64.zip
            dist/ZeTer-OS-*-Windows-x64.sha256.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: verify
    if: github.repository == 'zeter1/ZeTer-OS' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Require fresh Russian release notes on package pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq RELEASE_NOTES_RU.md || {
            echo "RELEASE_NOTES_RU.md must be updated in the same [package] commit."
            exit 1
          }

      - name: Download exact distribution built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ZeTer-OS-Windows-x64
          path: release

      - name: Publish GitHub Release with Russian notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          # A retry gets a new tag. Never replace bytes referenced by an older feed.
          tag="build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="ZeTer OS — Windows-сборка $short_sha"
          gh release create "$tag" release/ZeTer-OS-*-Windows-x64.zip release/ZeTer-OS-*-Windows-x64.sha256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" \
            --notes-file RELEASE_NOTES_RU.md --prerelease

      - name: Set up Python for update feed
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify public ZIP and create Pages update feed
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          packages=(release/ZeTer-OS-*-Windows-x64.zip)
          test "${#packages[@]}" -eq 1
          mkdir pages
          cp -R app/. pages/
          python tools/build_update_feed.py --package "${packages[0]}" --tag "$tag" \
            --output pages/updates.json --verify-download --notes 'Подробности — в истории изменений ZeTer OS.'

      - name: Upload verified Pages site and update feed
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  publish-pages:
    needs: publish-release
    if: github.repository == 'zeter1/ZeTer-OS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python for publication guard
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Reject stale run or published version downgrade
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          python tools/build_update_feed.py --check-publication \
            --revision "$GITHUB_SHA" --latest-revision "$latest_sha"

      - name: Publish update feed after verified Release
        id: deployment
        uses: actions/deploy-pages@v4
